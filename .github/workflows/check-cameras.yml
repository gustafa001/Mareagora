name: Verificar câmeras ao vivo

on:
  schedule:
    - cron: '0 12 * * 1' # segundas, 09:00 BRT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar verificação
        id: check
        run: |
          set +e
          node scripts/check-cameras.mjs | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Abrir PR removendo as câmeras fora do ar
        id: pr
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          IDS=$(grep '^FALHA' report.txt | awk '{print $2}')
          BRANCH="auto/remove-dead-cameras"
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Já existe um PR aberto para $BRANCH; nada a fazer."
            echo "done=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/remove-dead-cameras.mjs $IDS || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add lib
          git commit -m "fix(cameras): remove câmeras do YouTube removidas/privadas" || exit 0
          git push -f origin "$BRANCH" || exit 0
          {
            echo "Vídeos removidos ou privados no YouTube, detectados pelo workflow semanal:"
            echo
            echo '```'
            grep '^FALHA' report.txt
            echo '```'
            echo
            echo "Faça merge para tirar as câmeras do site, ou feche o PR e troque o videoId por um novo."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          gh pr create --base main --head "$BRANCH" --title "Remover câmeras ao vivo fora do ar" --body-file body.md \
            && echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Fallback - abrir issue se não foi possível abrir o PR
        if: steps.check.outputs.code == '1' && steps.pr.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Câmeras com vídeo removido ou privado no YouTube:"
            echo
            echo '```'
            grep '^FALHA' report.txt
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          gh label create cameras --color 0E8A16 --description "Câmeras ao vivo" 2>/dev/null || true
          existing=$(gh issue list --label cameras --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Câmeras ao vivo fora do ar" --label cameras --body-file body.md
          fi
